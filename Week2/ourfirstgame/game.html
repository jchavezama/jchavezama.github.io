<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Pokemon</title>
</head>
<body style="background-color: black;">

    <h2 style="color: white; font-family: 'Courier New', Courier, monospace; text-align: center;">
        A wild Dragonite has appeared
    </h2>

    <div class="2d-battle">
        <img id="dragonite-sprite" src="./assets/dragonitefront.png" alt="Wild Dragonite" style="position: absolute; top: 15%; right: 15%; width: 30%; z-index: 1;">

        <img id="lucario-sprite" src="./assets/Lucario.png" alt="Player Lucario" style="position: absolute; bottom: -5%; left: 10%; width: 45%; z-index: 2;">
    </div>

    <div class="battle-menu" style="text-align: center;">
        <button id="btn-fight" style="background-color: white; border-radius: 50px; font-size: 20px; padding: 15px 30px; font-family: 'Courier New', Courier, monospace;">Fight</button>

        <button id="btn-bag" style="background-color: white; border-radius: 50px; font-size: 20px; padding: 15px 30px; font-family: 'Courier New', Courier, monospace;">Bag</button>

        <button id="btn-flee" style="background-color: white; border-radius: 50px; font-size: 20px; padding: 15px 30px; font-family: 'Courier New', Courier, monospace;">Flee</button>

        <button id="btn-switch" style="background-color: white; border-radius: 50px; font-size: 20px; padding: 15px 30px; font-family: 'Courier New', Courier, monospace;">Switch</button>
    </div>
</body>
</html>
